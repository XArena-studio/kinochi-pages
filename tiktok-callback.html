<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok ulanish -- Kinochi</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; line-height: 1.6; color: #222; }
  h1 { font-size: 24px; }
  .code-box { margin-top: 24px; padding: 18px; background: #f4f4f5; border: 1px solid #ddd; border-radius: 10px; word-break: break-all; font-family: monospace; font-size: 15px; }
  .hint { color: #666; margin-top: 20px; }
  button { margin-top: 16px; padding: 12px 20px; background: #000; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; }
  button:active { opacity: 0.8; }
  .error { color: #c0392b; }
  .copied { color: #2AABEE; font-weight: 600; margin-left: 10px; }
  footer { margin-top: 60px; color: #999; font-size: 13px; }
</style>
</head>
<body>
  <h1>TikTok ulanish</h1>
  <p>TikTok sizga ruxsat berdi. Quyidagi kodni nusxalab, terminalga (CLI) qaytib joylashtiring:</p>

  <div id="result"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');
    const errorDesc = params.get('error_description');
    const resultDiv = document.getElementById('result');

    if (error) {
      resultDiv.innerHTML =
        '<p class="error"><strong>Xato:</strong> ' + error + '</p>' +
        (errorDesc ? '<p class="error">' + errorDesc + '</p>' : '') +
        '<p class="hint">Terminalga qaytib, qaytadan urinib ko\'ring.</p>';
    } else if (code) {
      resultDiv.innerHTML =
        '<div class="code-box" id="codeBox">' + code + '</div>' +
        '<button onclick="copyCode()">Kodni nusxalash</button>' +
        '<span class="copied" id="copiedMsg" style="display:none;">Nusxalandi!</span>' +
        '<p class="hint">Nusxalagandan so\'ng, ushbu sahifani yopib, terminalga qaytib, kodni joylashtiring (Ctrl+V) va Enter bosing.</p>';
    } else {
      resultDiv.innerHTML = '<p class="error">Kod topilmadi. Iltimos, jarayonni terminaldan qaytadan boshlang.</p>';
    }

    function copyCode() {
      const codeText = document.getElementById('codeBox').innerText;
      navigator.clipboard.writeText(codeText).then(() => {
        document.getElementById('copiedMsg').style.display = 'inline';
      });
    }
  </script>

  <footer><a href="./index.html">&larr; Bosh sahifa</a></footer>
</body>
</html>
